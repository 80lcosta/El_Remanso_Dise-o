const SEASONS = ['Primavera', 'Verano', 'Otoño', 'Invierno'];
const SDAYS = [91, 90, 92, 92];
const DESIGN_IDX = [2, 3, 4, 5, 6, 7, 8]; // 28/29 a 34/35

function computeModel(P, ROT, RG, scenario) {
  const nC = ROT[0].crops.length;
  const lastJ = nC - 1;
  const totalHa = ROT.reduce((a, l) => a + l.ha, 0);
  // ---------- Superficies ----------
  const sum = (j, pred) => ROT.reduce((a, l) => a + (pred(l.crops[j], l, j) ? l.ha : 0), 0);
  const avenaOn = (l, j) => l.crops[j] === 'Maíz silo' && (j === lastJ || (!String(l.crops[j + 1]).startsWith('PP') && !String(l.crops[j + 1]).startsWith('Cebada')));
  const nichoOn = (l, j) => j < lastJ && l.crops[j] === 'Maíz grano' && ['Maíz grano', 'Maíz silo', 'Girasol'].includes(l.crops[j + 1]);
  const S = [];
  for (let j = 0; j < nC; j++) {
    const s = {};
    ['PP 1', 'PP 2', 'PP 3', 'PP 4', 'pastizal', 'Maíz grano', 'Maíz silo', 'Girasol', 'Cebada/Soja 2da'].forEach(k => s[k] = sum(j, c => c === k));
    s.past = s['PP 1'] + s['PP 2'] + s['PP 3'] + s['PP 4'];
    s.pp1 = s['PP 1'];
    s.pz = s['pastizal'];
    s.silo = s['Maíz silo'];
    s.avena = ROT.reduce((a, l) => a + (avenaOn(l, j) ? l.ha : 0), 0);
    s.nichos = ROT.reduce((a, l) => a + (nichoOn(l, j) ? l.ha : 0), 0);
    s.total = totalHa;
    s.pctPast = s.past / (totalHa - ROT.filter(l => l.crops.every(c => c === 'pastizal')).reduce((a, l) => a + l.ha, 0));
    S.push(s);
  }
  // ---------- Recría ----------
  const a = P.adg;
  const D = { cab: 365 + P.overlap, cue: 244, ret: 244 + P.retDays, col: 244 };
  const F = { cab: P.wCab + a * D.cab, cue: P.wCue + a * D.cue, ret: P.wCue + a * D.ret, col: P.wCol + a * D.col };
  const G = { cab: a * D.cab, cue: a * D.cue, ret: a * D.ret, col: a * D.col };
  const tr = (w, s0, s1, days) => (w + a * (s0 + s1) / 2) * P.cons * days;
  const tramos = [
    ['Cabeza', 'Abr-may, año 1', 2, 61, 0, 61, P.wCab, P.sCab],
    ['Cabeza', 'Jun-ago, año 1', 3, 92, 61, 153, P.wCab, P.sCab],
    ['Cabeza', 'Sep-nov, año 1', 0, 91, 153, 244, P.wCab, P.sCab],
    ['Cabeza', 'Dic-feb', 1, 90, 244, 334, P.wCab, P.sCab],
    ['Cabeza', 'Mar + superposición', 2, 31 + P.overlap, 334, 365 + P.overlap, P.wCab, P.sCab],
    ['Cuerpo', 'Abr-may', 2, 61, 0, 61, P.wCue, P.sCue],
    ['Cuerpo', 'Jun-ago', 3, 92, 61, 153, P.wCue, P.sCue],
    ['Cuerpo', 'Sep-nov', 0, 91, 153, 244, P.wCue, P.sCue],
    ['Cola', 'Abr-may', 2, 61, 0, 61, P.wCol, P.sCol],
    ['Cola', 'Jun-ago', 3, 92, 61, 153, P.wCol, P.sCol],
    ['Cola', 'Sep-nov', 0, 91, 153, 244, P.wCol, P.sCol],
  ].map(([cat, tramo, season, days, d0, d1, w, share]) => ({ cat, tramo, season, days, d0, d1, share, peso: w + a * (d0 + d1) / 2, kg: tr(w, d0, d1, days) }));
  const cons = [0, 0, 0, 0];
  tramos.forEach(t => cons[t.season] += t.kg * t.share);
  const consTot = cons.reduce((x, y) => x + y, 0);
  const H14 = tramos[3].kg; // cabeza dic-feb
  const retCons = (P.wCue + a * 244 + P.wCue + a * (244 + P.retDays)) / 2 * P.cons * P.retDays;
  const retGain = a * P.retDays;
  const kgAnimal = G.cab * P.sCab + G.cue * P.sCue + G.col * P.sCol;
  const conversion = consTot / kgAnimal;
  // ---------- Balance forrajero ----------
  const prod = scenario === 'medio' ? P.ppMed : P.ppObj;
  const f = P.pp1SpringFrac;
  const pp1S = [P.ppS[0] * f / (P.ppS[0] * f + P.ppS[1]), P.ppS[1] / (P.ppS[0] * f + P.ppS[1]), 0, 0];

  const nClose = R.B.filter(b => b.cierra).length;
  const bandPos = v => Math.max(0, Math.min(100, v / 700 * 100));
  const k = [
    kpi({ cls: 'hero', lbl: 'Compra de diseño · 1 de abril', val: f0(Math.floor(R.design)), unit: 'cabezas', sub: `${f0(Math.round(R.design * ST.vals.sCab))} cabeza · ${f0(Math.round(R.design * ST.vals.sCue))} cuerpo · ${f0(Math.round(R.design * ST.vals.sCol))} cola · ${f0(Math.floor(R.retD))} cuerpos retenidos en verano`, delta: delta(R.design, R0.design, f0, true, ' cab'), tip: 'La menor compra máxima entre 28/29 y 34/35: la que se sostiene todos los años.' }),
    kpi({ lbl: 'Carne producida', val: f0(R.carne), unit: 'kg/año', sub: `${f1(R.kgAnimal)} kg por animal + ${f0(R.retGain)} kg por retenido`, delta: delta(R.carne, R0.carne, f0, true, ' kg') }),
    kpi({ lbl: 'Producción por ha ganadera', val: f0(R.kgHa), unit: 'kg/ha', extra: `<div class="band" data-tip="Banda de referencia 300 a 500 kg/ha: invernada pastoril intensiva del sudeste (texto de la planilla)"><i style="left:${bandPos(300)}%;width:${bandPos(500) - bandPos(300)}%"></i><b style="left:calc(${bandPos(R.kgHa)}% - 1px)"></b></div>`, sub: `Referencia 300-500 · ${f0(R.kgHaCampo)} kg/ha sobre las ${f0(R.totalHa)} ha`, delta: delta(R.kgHa, R0.kgHa, f0, true, ' kg/ha') }),
    kpi({ lbl: 'Carga media anual', val: f2(R.evAnual), unit: 'EV/ha gan.', sub: `${f2(R.evAnualCampo)} EV/ha sobre el campo entero`, delta: delta(R.evAnual, R0.evAnual, f2, true) }),
    kpi({ lbl: 'Superficie ganadera efectiva', val: f1(R.supDesign), unit: 'ha', sub: `${pct(R.supDesign / R.totalHa)} del campo · promedio 28/29-34/35`, delta: delta(R.supDesign, R0.supDesign, f1, true, ' ha'), tip: 'Cada recurso pesado por su coeficiente de ocupación. El maíz silo va en cero.' }),
    kpi({ lbl: 'Diferencia de hacienda', val: mill(avgDif), unit: '/año', sub: `Ventas − compras, promedio 28/29-34/35. Indiferencia ${money(ind)}/kg`, delta: delta(avgDif, avgDif0, mill, true) }),
    kpi({ lbl: 'Campañas que cierran el balance', val: `${nClose}<small>/ ${CAMP.length}</small>`, sub: R.B.filter(b => !b.cierra).map(b => CAMP[b.j]).join(', ') ? `No cierran: ${R.B.filter(b => !b.cierra).map(b => CAMP[b.j]).join(', ')}` : 'Todas cierran con la compra de diseño' }),
    kpi({ lbl: 'Pico de animales (abril)', val: f0(R.pico), unit: 'cab', sub: `Agua: ${f0(R.agua.litros)} L/día · ${f0(R.agua.caudal)} L/min`, delta: delta(R.pico, R0.pico, f0, false, ' cab') }),
  ].join('');
  const maxs = R.B.map(b => b.maxBuy);
  const chart1 = bars({ cats: CAMP, series: [{ name: 'Compra máxima que banca el pasto', color: 'var(--r-past)', values: maxs }], h: 230, dim: [0, 1], hl: [R.bindJ], lines: [{ v: R.design, label: `Compra de diseño ${f0(Math.floor(R.design))}` }], valueLabels: true, fmt: f0, aria: 'Compra máxima por campaña' });
  const heat = `<div class="tbl-wrap" style="border:0"><table class="heat"><thead><tr><th></th>${CAMP.map((c, j) => `<th class="${j === R.bindJ ? 'bind' : ''}">${c}</th>`).join('')}</tr></thead><tbody>
    ${SEAS.map((s, k) => `<tr><td>${s}</td>${R.B.map(b => { const r = b.saldo[k] / b.demand[k]; return `<td class="cell" style="background:${divColor(r)};color:${Math.abs(r) > .55 ? '#fff' : 'var(--ink)'}" data-tip="${esc(`<b>${CAMP[b.j]} · ${s}</b><br>Oferta ${tn(b.offer[k])} · demanda ${tn(b.demand[k])}<br>Saldo ${tn(b.saldo[k])}`)}">${Math.abs(b.saldo[k]) < 500 ? '0' : (b.saldo[k] > 0 ? '+' : '−') + f0(Math.abs(b.saldo[k]) / 1000)}</td>`; }).join('')}</tr>`).join('')}
    <tr><td>Reservas</td>${R.B.map(b => `<td><span class="pill ${b.cierra ? 'ok' : 'no'}" data-tip="${esc(`<b>${CAMP[b.j]}</b><br>Déficit ${tn(b.deficit)} · guardado ${tn(b.stored)}`)}">${b.cierra ? 'Cierra' : 'Falta'}</span></td>`).join('')}</tr></tbody></table></div>`;
  return `<div class="sec-head"><div><h2>El planteo de <em>El Remanso</em> en números</h2><p>${f0(R.totalHa)} ha productivas, rotación de 9 campañas (26/27 a 34/35) y recría de novillitos comprados el 1 de abril. Escenario de pastura: <b>${ST.scenario === 'medio' ? 'año medio' : 'objetivo'}</b>, ${f0(R.prod)} kg MS/ha/año.</p></div></div>
    <div class="kpis">${k}</div>
    <div class="grid2">
      <div class="card chart"><h4>Cuántos animales banca cada campaña</h4><p class="cap">Compra máxima el 1 de abril con pasto + reservas. 26/27 y 27/28 (atenuadas) quedan fuera del diseño: la pastura se está implantando.</p>${legend([['Compra máxima de la campaña', 'var(--r-past)'], [`Compra de diseño: ${f0(Math.floor(R.design))} cabezas`, 'var(--ink)', 'line']])}${chart1}</div>
      <div class="card"><h4>Saldo de pasto por estación</h4><p class="cap">Oferta de pasto menos demanda con la compra de diseño, en toneladas de MS. Rojo: falta (lo tapan silaje y rollo). Azul: sobra.</p>${heat}</div>
    </div>
    <div class="card"><h4>Lectura del planteo</h4><p class="cap">Se recalcula con cada cambio.</p><ul class="list insights">${insights(R).map(t => `<li>${t}</li>`).join('')}</ul></div>`;
}

// ---------- ROTACIÓN ----------
function cropSelect(li, j, c) {
  const st = CROP_STYLE[c] || ['var(--surface-2)', 'var(--ink)', c];
  const edited = ST.rotTouched.has(li + ':' + j);
  return `<select class="crop ${edited ? 'edited' : ''}" data-li="${li}" data-j="${j}" style="background:${st[0]};color:${st[1]}" aria-label="Lote ${esc(ST.rot[li].id)}, ${CAMP[j]}">${CROPS.map(o => `<option value="${esc(o)}" ${o === c ? 'selected' : ''}>${esc(CROP_STYLE[o][2])}</option>`).join('')}</select>`;
}
function renderRotacion(R, R0) {
  const S = R.S; const avg = f => sumA(DESIGN_IDX.map(j => f(S[j]))) / DESIGN_IDX.length;
  const agri = s => s['Maíz grano'] + s['Girasol'] + s['Cebada/Soja 2da'] + s['Maíz silo'];
  const k = [
    kpi({ lbl: 'Pastura perenne promedio', val: f1(avg(s => s.past)), unit: 'ha', sub: `${pct(avg(s => s.pctPast))} de la superficie rotable · 28/29-34/35`, delta: delta(avg(s => s.past), sumA(DESIGN_IDX.map(j => R0.S[j].past)) / 7, f1, true, ' ha') }),
    kpi({ lbl: 'Agricultura promedio', val: f1(avg(agri)), unit: 'ha', sub: `Maíz grano ${f1(avg(s => s['Maíz grano']))} · girasol ${f1(avg(s => s['Girasol']))} · silo ${f1(avg(s => s['Maíz silo']))}` }),
    kpi({ lbl: 'Avena sobre maíz silo', val: f1(avg(s => s.avena)), unit: 'ha/año', sub: 'No se siembra si después viene pastura o cebada' }),
    kpi({ lbl: 'Nichos de raigrás al voleo', val: f1(avg(s => s.nichos)), unit: 'ha/año', sub: 'Maíz grano seguido de un cultivo de verano' }),
  ].join('');
  const rows = ST.rot.map((l, li) => `<tr><td><b>Lote ${esc(l.id)}</b><span class="meta">${esc(l.amb)} · ${f2(l.ha)} ha</span></td>${l.crops.map((c, j) => {
    const av = c === 'Maíz silo' && (j === CAMP.length - 1 || (!String(l.crops[j + 1]).startsWith('PP') && !String(l.crops[j + 1]).startsWith('Cebada')));
    const rg = j < CAMP.length - 1 && c === 'Maíz grano' && ['Maíz grano', 'Maíz silo', 'Girasol'].includes(l.crops[j + 1]);
    return `<td>${cropSelect(li, j, c)}<div class="tags">${av ? '<span class="tag av" data-tip="Lleva avena sobre el rastrojo del maíz silo">+Avena</span>' : ''}${rg ? '<span class="tag rg" data-tip="Nicho posible para volear raigrás dentro del maíz">Raigrás</span>' : ''}</div></td>`;
  }).join('')}</tr>`).join('');
  const series = [['PP 1', 'PP 1'], ['PP 2', 'PP 2'], ['PP 3', 'PP 3'], ['PP 4', 'PP 4'], ['pastizal', 'Pastizal'], ['Maíz silo', 'Maíz silo'], ['Maíz grano', 'Maíz grano'], ['Girasol', 'Girasol'], ['Cebada/Soja 2da', 'Cebada/Soja 2ª']];
  const ch = bars({ cats: CAMP, stacked: true, h: 260, series: series.map(([key, n]) => ({ name: n, color: CROP_STYLE[key][0], values: S.map(s => s[key]) })), fmt: v => f1(v) + ' ha', axisFmt: f0, aria: 'Superficie por uso y campaña' });
  const ctr = R.controles.filter(c => c.tipo !== 'antecesor' || c.ok !== true);
  const ctrHtml = ctr.length ? ctr.map(c => {
    if (c.tipo === 'maiz') return `<li><span class="pill wa">Revisar</span><span>Lote ${esc(c.lote.id)}, ${CAMP[c.j - 1]} → ${CAMP[c.j]}: ${esc(c.prev)} → ${esc(c.c)}. Maíz sobre maíz: sube la presión de enfermedades de rastrojo y el consumo de N.</span></li>`;
    if (c.tipo === 'antecesor') return c.ok === null ? `<li><span class="pill mu">Sin dato</span><span>Lote ${esc(c.lote.id)}: PP 1 en ${CAMP[c.j]}, el antecesor es previo al plan.</span></li>` : `<li><span class="pill no">Revisar</span><span>Lote ${esc(c.lote.id)}: PP 1 en ${CAMP[c.j]} sobre ${esc(c.prev)}.</span></li>`;
    return `<li><span class="pill no">Revisar</span><span>Lote ${esc(c.lote.id)}, ${CAMP[c.j]}: ${esc(c.prev)} → ${esc(c.c)}. La pastura tiene que avanzar PP 1 → PP 2 → PP 3 → PP 4.</span></li>`;
  }).join('') : '<li><span class="pill ok">OK</span><span>Sin secuencias para revisar.</span></li>';
  const nPP1 = R.controles.filter(c => c.tipo === 'antecesor' && c.ok === true).length;
  return `<div class="sec-head"><div><h2>Rotación por lote y campaña</h2><p>Hacé clic en una celda para cambiar el cultivo. La avena y los nichos de raigrás se recalculan solos, igual que en la planilla.</p></div>${ST.rotTouched.size ? '<button class="btn" id="rot-reset" type="button">Volver a la rotación de la planilla</button>' : ''}</div>
    <div class="kpis">${k}</div>
    <div class="tbl-wrap"><table class="rot"><thead><tr><th>Lote</th>${CAMP.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows}
      <tr class="tot"><td>Pastura total</td>${S.map(s => `<td>${f1(s.past)} ha</td>`).join('')}</tr></tbody></table></div>
    <div class="grid2">
      <div class="card chart"><h4>Superficie por uso</h4><p class="cap">Hectáreas brutas por campaña (${f0(R.totalHa)} ha).</p>${legend(series.map(([key, n]) => [n, CROP_STYLE[key][0]]))}${ch}</div>
      <div class="card"><h4>Controles de la rotación</h4><p class="cap">${nPP1} implantaciones de pastura con antecesor correcto. Se recalcula al editar.</p><ul class="list">${ctrHtml}</ul></div>
    </div>`;
}

// ---------- BALANCE ----------
function renderBalance(R, R0) {
  if (ST.camp == null) ST.camp = R.bindJ;
  const j = ST.camp, b = R.B[j];
  const limS = b.supports.indexOf(Math.min(...b.supports));
  const sel = `<div class="campsel">${CAMP.map((c, i) => `<button type="button" data-camp="${i}" aria-pressed="${i === j}" class="${i === R.bindJ ? 'lim' : ''}">${c}</button>`).join('')}</div>`;
  const k = [
    kpi({ cls: j === R.bindJ ? 'hero' : '', lbl: `Compra máxima ${CAMP[j]}`, val: f0(b.maxBuy), unit: 'cab', sub: j === R.bindJ ? 'Es la campaña que pone el techo del diseño' : (j < 2 ? 'Fuera del diseño: pastura en implantación' : `Diseño: ${f0(Math.floor(R.design))} cab`) }),
    kpi({ lbl: 'Estación más ajustada', val: SEAS[limS], sub: `Banca ${f0(b.supports[limS])} animales sólo con su pasto` }),
    kpi({ lbl: 'Forraje guardado', val: tn(b.stored), sub: `Silaje ${tn(b.silaje)} · rollo ${tn(b.rollo)}` }),
    kpi({ lbl: 'Déficit a tapar', val: tn(b.deficit), sub: `${b.cierra ? 'Sobran' : 'Faltan'} ${tn(Math.abs(b.sobra))} con la compra de diseño`, extra: `<span class="pill ${b.cierra ? 'ok' : 'no'}" style="align-self:flex-start">${b.cierra ? 'Cierra' : 'No cierra'}</span>` }),
    kpi({ lbl: 'Cuerpo retenido en verano', val: f0(Math.floor(b.ret)), unit: 'cab', sub: `Se comen el excedente de verano y salen a ${f0(R.F.ret)} kg` }),
  ].join('');
  const parts = [['Pastura', 'pastura', 'var(--r-past)'], ['Pastizal', 'pastizal', 'var(--r-pz)'], ['Avena', 'avena', 'var(--r-av)'], ['Raigrás', 'raigras', 'var(--r-rg)']];
  const ch1 = bars({ cats: SEAS, stacked: true, h: 250, series: parts.map(([n, key, c]) => ({ name: n, color: c, values: b.offerParts.map(p => p[key]) })), markers: { values: b.demand, label: 'Demanda con la compra de diseño' }, fmt: tn, axisFmt: v => f0(v / 1000), aria: 'Oferta y demanda por estación' });
  const ch2 = bars({ cats: CAMP, h: 230, series: [{ name: 'Déficit de pasto', color: 'var(--div-neg)', values: R.B.map(x => x.deficit) }, { name: 'Silaje + rollo disponible', color: 'var(--r-silo)', values: R.B.map(x => x.stored) }], fmt: tn, axisFmt: v => f0(v / 1000), hl: [j], aria: 'Déficit y reservas por campaña' });
  const sc = ST.scenario;
  const rgRows = CAMP.map((c, i) => {
    const max = R.S[i].nichos; const v = ST.rg[sc][i]; const ok = v <= max + 0.01;
    return `<div class="rgrow"><b>${c}</b><input type="range" data-rg="${i}" min="0" max="${Math.max(max, v).toFixed(2)}" step="0.1" value="${v}" ${max <= 0 && v <= 0 ? 'disabled' : ''} aria-label="Raigrás ${c}"><div><input type="number" data-rgn="${i}" min="0" step="0.1" value="${v}" aria-label="ha de raigrás ${c}"><div class="cap2">${ok ? `de ${f1(max)} ha` : `<span style="color:var(--bad)">máx. ${f1(max)} ha</span>`}</div></div></div>`;
  }).join('');
  const row = (lab, f, cls = '') => `<tr class="${cls}"><td>${lab}</td>${R.B.map(x => `<td class="${x.j === R.bindJ ? 'bind' : ''}">${f(x)}</td>`).join('')}</tr>`;
  const table = `<div class="tbl-wrap"><table><thead><tr><th>Concepto</th>${CAMP.map((c, i) => `<th class="${i === R.bindJ ? 'bind' : ''}">${c}</th>`).join('')}</tr></thead><tbody>
    <tr class="grp"><td colspan="10">Superficies (ha)</td></tr>
    ${row('Pastura total', x => f1(R.S[x.j].past))}${row('  de la cual PP 1', x => f1(R.S[x.j].pp1))}${row('Avena', x => f1(R.S[x.j].avena))}${row('Maíz silo', x => f1(R.S[x.j].silo))}${row('Raigrás voleado', x => f1(x.rg))}${row('Superficie ganadera efectiva', x => f1(x.supG), 'tot')}
    <tr class="grp"><td colspan="10">Oferta de pasto utilizable (t MS)</td></tr>
    ${SEAS.map((s, kk) => row(s, x => f1(x.offer[kk] / 1000))).join('')}${row('Silaje + rollo', x => f1(x.stored / 1000))}
    <tr class="grp"><td colspan="10">Animales</td></tr>
    ${row('Compra máxima', x => f0(x.maxBuy), 'tot')}${row('Cuerpo retenido', x => f0(x.ret))}
    <tr class="grp"><td colspan="10">Balance con la compra de diseño (t MS)</td></tr>
    ${SEAS.map((s, kk) => row('Saldo ' + s.toLowerCase(), x => `<span style="color:${x.saldo[kk] < -0.5 ? 'var(--bad)' : 'inherit'}">${f1(x.saldo[kk] / 1000)}</span>`)).join('')}
    ${row('Déficit a tapar', x => f1(x.deficit / 1000))}${row('Sobra o falta', x => f1(x.sobra / 1000), 'tot')}${row('¿Cierra?', x => `<span class="pill ${x.cierra ? 'ok' : 'no'}">${x.cierra ? 'Sí' : 'No'}</span>`)}${row('Pasto que sobra y no se come', x => f1(x.sobrante / 1000))}
  </tbody></table></div>`;
  return `<div class="sec-head"><div><h2>Balance forrajero</h2><p>Oferta de pasto por estación contra la demanda de la recría. El silaje y el rollo tapan el bache donde haga falta; el excedente de verano se lo come el cuerpo retenido.</p></div>${sel}</div>
    <div class="kpis k5">${k}</div>
    <div class="grid2">
      <div class="card chart"><h4>Oferta y demanda por estación · ${CAMP[j]}</h4><p class="cap">Toneladas de MS utilizable. La raya negra es la demanda con la compra de diseño.</p>${legend([...parts.map(p => [p[0], p[2]]), ['Demanda', 'var(--ink)', 'line']])}${ch1}</div>
      <div class="card chart"><h4>Déficit de pasto contra reservas</h4><p class="cap">Si las reservas superan al déficit, la campaña cierra.</p>${legend([['Déficit de pasto', 'var(--div-neg)'], ['Silaje + rollo', 'var(--r-silo)']])}${ch2}</div>
    </div>
    <div class="grid2">
      <div class="card"><h4>Raigrás al voleo · escenario ${sc === 'medio' ? 'año medio' : 'objetivo'}</h4><p class="cap">La palanca de la planilla. Hectáreas que se volean dentro del maíz para grano. No puede superar los nichos de esa campaña. El raigrás aporta sobre todo en primavera; el bache está en otoño e invierno.</p>${rgRows}</div>
      <div class="card"><h4>Cómo se calcula</h4><ul class="list note" style="gap:6px">
        <li>Oferta = ha × producción × % de la estación × eficiencia de cosecha. La PP 1 rinde el ${pct(ST.vals.pp1Factor)} y sólo produce en primavera y verano.</li>
        <li>En primavera se pastorea el ${pct(ST.vals.springGraze)} de la pastura; el resto se hace rollo.</li>
        <li>Compra máxima: se ordenan las estaciones de más a menos ajustada y se busca cuántos animales se pueden comprar tapando los baches con silaje y rollo.</li>
        <li>Compra de diseño: la menor compra máxima entre 28/29 y 34/35.</li>
        <li>Superficie ganadera: pastura y pastizal al 100%, avena al ${pct(ST.vals.occAv)}, raigrás al ${pct(ST.vals.occRg)} y maíz silo al ${pct(ST.vals.occSilo)} del año.</li></ul></div>
    </div>
    ${table}`;
}

// ---------- RECRÍA ----------
function gantt(R) {
  const W = 960, H = 210, L = 150, Rr = 10, T = 26;
  const months = ['abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic', 'ene', 'feb', 'mar', 'abr'];
  const days = 365 + 30; const x = d => L + d / days * (W - L - Rr);
  const rows = [['Cabeza', 0, R.D.cab, ST.vals.wCab, R.F.cab, 'var(--h-cab)'], ['Cuerpo (venta 1-dic)', 0, R.D.cue, ST.vals.wCue, R.F.cue, 'var(--h-cue)'], ['Cuerpo retenido', 0, R.D.ret, ST.vals.wCue, R.F.ret, 'var(--h-vieja)'], ['Cola', 0, R.D.col, ST.vals.wCol, R.F.col, 'var(--h-col)']];
  let s = `<svg viewBox="0 0 ${W} ${H}" class="gantt" role="img" aria-label="Calendario de la recría">`;
  const seasonsBands = [[0, 61, 2], [61, 153, 3], [153, 244, 0], [244, 334, 1], [334, 395, 2]];
  seasonsBands.forEach(([a, b2, k]) => { s += `<rect x="${x(a)}" y="${T - 4}" width="${x(b2) - x(a)}" height="${H - T - 6}" fill="${SCOL[k]}" opacity=".07"/>`; });
  const mdays = [0, 30, 61, 91, 122, 153, 183, 214, 244, 275, 306, 334, 365];
  mdays.forEach((d, i) => { s += `<line class="grid" x1="${x(d)}" x2="${x(d)}" y1="${T - 4}" y2="${H - 10}"/><text x="${x(d) + 3}" y="${T - 10}">${months[i]}</text>`; });
  rows.forEach(([n, a, d, w0, w1, c], i) => {
    const yy = T + 10 + i * 40;
    s += `<text class="lab" x="0" y="${yy + 13}">${n}</text><rect class="m" x="${x(a)}" y="${yy}" width="${x(d) - x(a)}" height="18" rx="4" fill="${c}" data-tip="${esc(`<b>${n}</b><br>${f0(d)} días en el campo<br>Entra ${f0(w0)} kg · sale ${f0(w1)} kg`)}"/>`;
    s += `<text x="${x(a) + 8}" y="${yy + 13}" style="fill:#fff;font-weight:600">${f0(w0)} kg</text><text x="${x(d) - 8}" y="${yy + 13}" text-anchor="end" style="fill:#fff;font-weight:600">${f0(w1)} kg · ${f0(d)} días</text>`;
  });
  return s + '</svg>';
}
function renderRecria(R, R0) {
  const k = [

function renderSupuestos() {
  const groups = [...new Set(PARAM_DEFS.map(d => d[1]))];

  const sumPP = ST.vals.ppS0 + ST.vals.ppS1 + ST.vals.ppS2 + ST.vals.ppS3;
  const warn = [];
  if (Math.abs(sumS - 1) > 0.001) warn.push(`El reparto cabeza + cuerpo + cola suma ${pct(sumS)}; tiene que dar 100%.`);
  if (Math.abs(sumPP - 1) > 0.001) warn.push(`Los % estacionales de la pastura suman ${pct(sumPP)}; tienen que dar 100%.`);
  const html = groups.map(g => `<div class="card pgroup"><h4 style="margin-bottom:6px">${g}</h4>${PARAM_DEFS.filter(d => d[1] === g).map(d => {
    const k = d[0], df = DEF[k], v = ST.vals[k], ch = ST.touched.has(k);
    const isP = df.fmt[0] === 'p';
    const shown = isP ? +(v * 100).toFixed(2) : v;
    return `<div class="prow ${ch ? 'changed' : ''}"><div class="pl"><span>${esc(df.label)}</span><small>${esc(df.src)}</small></div>
      <div class="pin"><input type="number" data-pk="${k}" value="${shown}" step="${isP ? +(df.step * 100).toFixed(4) : df.step}" aria-label="${esc(df.label)}"><span class="note">${esc(isP ? '%' : df.unit)}</span></div>
      <div class="pb">Planilla: ${FMT[df.fmt](ST.base[k])}${ch ? `<br><button class="reset" type="button" data-rk="${k}">Restablecer</button>` : ''}</div></div>`;
  }).join('')}</div>`).join('');
  return `<div class="sec-head"><div><h2>Supuestos del modelo</h2><p>Son las celdas amarillas de la hoja Supuestos y los parámetros de Pastoreo rotativo, con su fuente. Al cambiar uno se recalcula todo el tablero.</p></div>${ST.touched.size ? '<button class="btn" id="sup-reset" type="button">Restablecer todos</button>' : ''}</div>

    <div class="grid2">${html}</div>`;
}

function setParam(k, v) {
  ST.vals[k] = v;
  if (Math.abs(v - ST.base[k]) < 1e-12) ST.touched.delete(k); else ST.touched.add(k);
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('#levers input[type=range]')) {
    const k = t.dataset.k; setParam(k, +t.value);
    $('#lvo-' + k).textContent = FMT[DEF[k].fmt](+t.value);
    t.closest('.lever').classList.toggle('changed', ST.touched.has(k));
    render();
  } else if (t.matches('[data-rg],[data-rgn]')) {
    const i = +(t.dataset.rg ?? t.dataset.rgn); const sc = ST.scenario; let v = Math.max(0, +t.value || 0);
    ST.rg[sc][i] = v;
    if (Math.abs(v - ST.rgBase[sc][i]) < 1e-9) ST.rgTouched[sc].delete(i); else ST.rgTouched[sc].add(i);
    const twin = t.dataset.rg != null ? document.querySelector(`[data-rgn="${i}"]`) : document.querySelector(`[data-rg="${i}"]`);
    if (twin) twin.value = v;
    renderPartialKeepFocus();
  }
});
let pt = 0;
function renderPartialKeepFocus() { clearTimeout(pt); pt = setTimeout(() => { const a = document.activeElement; const sel = a && (a.dataset.rg != null ? `[data-rg="${a.dataset.rg}"]` : a.dataset.rgn != null ? `[data-rgn="${a.dataset.rgn}"]` : null); render(); if (sel) requestAnimationFrame(() => requestAnimationFrame(() => { const n = document.querySelector(sel); if (n) n.focus(); })); }, 120); }
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('select.crop')) {
    const li = +t.dataset.li, j = +t.dataset.j; ST.rot[li].crops[j] = t.value;
    const key = li + ':' + j; if (ST.rot[li].crops[j] === ST.rotBase[li].crops[j]) ST.rotTouched.delete(key); else ST.rotTouched.add(key);
    renderLevers(run(false)); render();
  } else if (t.matches('[data-pk]')) {
    const k = t.dataset.pk; const df = DEF[k]; let v = +t.value; if (isNaN(v)) return;
    if (df.fmt[0] === 'p') v = v / 100;
    setParam(k, v); renderLevers(run(false)); render();

});
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-tab]'); if (!t) return;
  if (t.dataset.tab) { ST.tab = t.dataset.tab; store.set('remanso.tab', ST.tab); renderTabs(); render(); window.scrollTo({ top: 0 }); return; }
  if (t.dataset.camp != null) { ST.camp = +t.dataset.camp; render(); return; }
  if (t.dataset.rk) { setParam(t.dataset.rk, ST.base[t.dataset.rk]); renderLevers(run(false)); render(); return; }
  switch (t.id) {
    case 'sc-obj': case 'sc-medio': ST.scenario = t.id.slice(3); renderAll(); break;
    case 'go-sup': ST.tab = 'supuestos'; store.set('remanso.tab', ST.tab); renderTabs(); render(); window.scrollTo({ top: 0 }); break;
    case 'reset-all': ST.vals = { ...ST.base }; ST.touched.clear(); ST.rot = deep(ST.rotBase); ST.rotTouched.clear(); ST.rg = deep(ST.rgBase); ST.rgTouched = { obj: new Set(), medio: new Set() }; renderAll(); break;
    case 'sup-reset': ST.vals = { ...ST.base }; ST.touched.clear(); renderAll(); break;
    case 'rot-reset': ST.rot = deep(ST.rotBase); ST.rotTouched.clear(); renderAll(); break;

    case 'theme': { const next = isDark() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', next); store.set('remanso.theme', next); syncTheme(); break; }

});

document.addEventListener('mousemove', e => {

});

    gvPending[id] = resp => { clearTimeout(timer); s.remove(); if (resp.status === 'error') reject(new Error('gviz')); else resolve(resp.table); };
    s.onerror = () => { clearTimeout(timer); delete gvPending[id]; s.remove(); reject(new Error('blocked')); };
    s.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=reqId:${id};responseHandler:__remansoGviz&headers=0&sheet=${encodeURIComponent(sheet)}&range=${range}&t=${Date.now()}`;
    document.head.appendChild(s);
  });
}
const cellV = (row, i) => (row && row.c && row.c[i]) ? row.c[i].v : null;
const norm = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim().toLowerCase();
// etiquetas de la hoja Supuestos en orden
const SUP_LABELS = [['adg', 'Aumento diario de peso PROMEDIO ANUAL (kg/día)'], ['wCab', 'Peso de compra — CABEZA (kg)'], ['wCue', 'Peso de compra — CUERPO (kg)'], ['wCol', 'Peso de compra — COLA (kg)'], ['sCab', 'Reparto del lote — CABEZA (%)'], ['sCue', 'Reparto del lote — CUERPO (%)'], ['sCol', 'Reparto del lote — COLA (%)'], ['overlap', 'Días de superposición con la cabeza del año anterior'], ['cons', 'Consumo diario como % del peso vivo'], ['retDays', 'Días que el CUERPO RETENIDO pasa el verano'],
  ['ppObj', 'Producción — escenario OBJETIVO (kg MS/ha/año)'], ['ppMed', 'Producción — escenario AÑO MEDIO (kg MS/ha/año)'], ['ppS0', '% de la producción anual en Primavera (sep-nov)'], ['ppS1', '% en Verano (dic-feb)'], ['ppS2', '% en Otoño (mar-may)'], ['ppS3', '% en Invierno (jun-ago)'], ['ppE0', 'Eficiencia de cosecha en Primavera'], ['ppE1', 'Eficiencia de cosecha en Verano'], ['ppE2', 'Eficiencia de cosecha en Otoño'], ['ppE3', 'Eficiencia de cosecha en Invierno'], ['pp1Factor', 'Factor de producción de la pastura en su 1er año (PP 1)'], ['pp1SpringFrac', 'Fracción de la primavera en que produce la PP 1 (oct-nov de sep-nov)'],
  ['pzProd', 'Producción (kg MS/ha/año)'], ['pzS0', '% en Primavera'], ['pzS1', '% en Verano'], ['pzS2', '% en Otoño'], ['pzS3', '% en Invierno'], ['pzEff', 'Eficiencia de utilización'],
  ['avProd', 'Avena — producción (kg MS/ha)'], ['avOto', '% en Otoño'], ['avInv', '% en Invierno'], ['avPrim', '% en Primavera'], ['avEff', 'Eficiencia de utilización'],
  ['rgProd', 'Raigrás al voleo — producción (kg MS/ha)'], ['rgOto', '% en Otoño'], ['rgInv', '% en Invierno'], ['rgPrim', '% en Primavera'], ['rgEff', 'Eficiencia de utilización'],
  ['occPP', 'Pastura perenne (PP 1 a PP 4)'], ['occPz', 'Pastizal'], ['occSilo', 'Maíz silo'], ['occAv', 'Avena sobre el rastrojo de maíz silo'], ['occRg', 'Raigrás voleado dentro del maíz a grano'],
  ['siloProd', 'Silaje de maíz planta entera (kg MS/ha)'], ['siloEff', 'Coef. de aprovechamiento del silaje'], ['rolloEff', 'Coef. de aprovechamiento del rollo de pastura'], ['springGraze', '% de la primavera de la pastura destinado a pastoreo'], ['evKg', 'Equivalencia: consumo de 1 EV (kg MS/día)'],
  ['priceBuy', 'Precio de compra — ternero ($/kg vivo)'], ['priceSell', 'Precio de venta — novillito ($/kg vivo)']];
async function loadLive(manual) {
  ST.live.status = 'loading'; renderStatus();
  try {
    const [sup, rot, bal, pas] = await Promise.all([gviz('Supuestos', 'A1:B160'), gviz('Rotacion', 'A1:N16'), gviz('Balance forrajero', 'A1:J170'), gviz('Pastoreo rotativo', 'A1:G80')]);
    const nb = { ...ST.base }; let miss = 0;
    // Supuestos: búsqueda secuencial por etiqueta
    let pos = 0; const rows = sup.rows;
    SUP_LABELS.forEach(([k, lab]) => {
      const want = norm(lab); let found = -1;
      for (let i = pos; i < rows.length; i++) if (norm(cellV(rows[i], 0)) === want) { found = i; break; }
      if (found >= 0 && typeof cellV(rows[found], 1) === 'number') { nb[k] = cellV(rows[found], 1); pos = found + 1; } else miss++;
    });
    // Pastoreo rotativo
    pas.rows.forEach(r => {
      const a = norm(cellV(r, 0));
      if (a === norm('Días de ocupación por parcela') && typeof cellV(r, 1) === 'number') nb.ocup = cellV(r, 1);
      if (a === norm('Eficiencia de cosecha con esa ocupación') && typeof cellV(r, 1) === 'number') nb.rotEff = cellV(r, 1);
      if (a === norm('Pastura alfalfa + festuca (días)')) [1, 2, 3, 4].forEach((c, i) => { if (typeof cellV(r, c) === 'number') nb['desc' + i] = cellV(r, c); });
      if (a === norm('Consumo por animal (L/día, verano)') && typeof cellV(r, 1) === 'number') nb.waterL = cellV(r, 1);
    });
    // Rotación
    const rr = rot.rows; let rotNew = null;
    const hdr = rr.findIndex(r => [5, 6, 7].every(c => /^\d\d\/\d\d$/.test(String(cellV(r, c) || ''))));
    const dataRows = rr.slice(hdr + 1).filter(r => typeof cellV(r, 3) === 'number' && typeof cellV(r, 5) === 'string' && norm(cellV(r, 0)) !== 'total');
    if (dataRows.length === ST.rotBase.length) {
      rotNew = dataRows.map((r, i) => ({ ...ST.rotBase[i], ha: cellV(r, 3), crops: [5, 6, 7, 8, 9, 10, 11, 12, 13].map(c => String(cellV(r, c) || '').trim()) }));
      if (rotNew.some(l => l.crops.some(c => !CROPS.includes(c)))) rotNew = null;
    }
    if (!rotNew) miss++;
    // Raigrás voleado (palanca de la hoja Balance)
    const rgRows = bal.rows.filter(r => norm(cellV(r, 0)).startsWith(norm('RAIGRÁS QUE SE VOLEA')));
    const rgNew = rgRows.length >= 2 ? { obj: [1, 2, 3, 4, 5, 6, 7, 8, 9].map(c => +cellV(rgRows[0], c) || 0), medio: [1, 2, 3, 4, 5, 6, 7, 8, 9].map(c => +cellV(rgRows[1], c) || 0) } : null;
    if (!rgNew) miss++;
    // aplicar: lo que el usuario no tocó sigue a la planilla
    PARAM_DEFS.forEach(d => { const k = d[0]; if (!ST.touched.has(k)) ST.vals[k] = nb[k]; });
    ST.base = nb;
    if (rotNew) { ST.rot = ST.rot.map((l, li) => ({ ...rotNew[li], crops: l.crops.map((c, j) => ST.rotTouched.has(li + ':' + j) ? c : rotNew[li].crops[j]) })); ST.rotBase = rotNew; }
    if (rgNew) { ['obj', 'medio'].forEach(sc => { ST.rg[sc] = rgNew[sc].map((v, i) => ST.rgTouched[sc].has(i) ? ST.rg[sc][i] : v); }); ST.rgBase = rgNew; }
    const d = new Date(); ST.live = { status: 'live', at: d.toLocaleDateString('es-AR') + ' ' + d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }), msg: miss ? `${miss} dato(s) no se encontraron en la planilla y quedaron con la copia.` : '' };
    renderAll();
  } catch (err) {
    ST.live = { status: 'snapshot', at: SHEET.readAt, msg: 'Este visor no permite leer la planilla en vivo. Se muestra la copia tomada en la fecha indicada.' };
    renderStatus();
  }
}

// ================= tema claro / oscuro =================
function isDark() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t === 'dark') return true; if (t === 'light') return false;
  return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
}
function syncTheme() {
  const d = isDark(); document.body.classList.toggle('is-dark', d);
  const b = $('#theme'); b.setAttribute('aria-label', d ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro');
}
(function initTheme() {
  const saved = store.get('remanso.theme'); if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
  syncTheme();
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncTheme);
  new MutationObserver(syncTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
})();

// ================= inicio =================
$('#sheet-link').href = SHEET.sheetUrl;
renderAll();
loadLive(false);
setInterval(() => { if (ST.live.status === 'live' && !document.hidden) loadLive(false); }, 120000);
})();
